name: CI

on:
  # main-only image build (like the other custom services): dev iteration is local/preview.
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY:   harbor.10.0.0.200.nip.io
  IMAGE_NAME: library/ktayl-claims
  GHCR_IMAGE: ghcr.io/andrelair-platform/ktayl-claims   # prod images: immutable SHA, durable
  # The Angular adjuster workbench (ADR-009) is a SECOND image built from the SAME commit. Backend +
  # frontend share the commit SHA tag → the git-Warehouse promotes a consistent backend+frontend pair.
  IMAGE_NAME_FRONTEND: library/ktayl-claims-frontend
  GHCR_IMAGE_FRONTEND: ghcr.io/andrelair-platform/ktayl-claims-frontend

jobs:
  # ── L0 + L1 — build & unit tests ───────────────────────────────────────────
  build-test:
    name: build & test (Java 21)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build & test
        run: mvn -B verify

  # ── L0 + L1 — the Angular workbench (type-check + production build) ─────────
  frontend:
    name: frontend build (Angular)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  # ── Build a verified, immutable artifact → Harbor (dev) + ghcr (prod) ──────
  build-and-push:
    name: build image → Harbor + ghcr
    needs: [build-test, frontend]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write     # cosign keyless
      packages: write     # push to ghcr.io
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute build metadata
        id: meta
        run: |
          SHA=$(git rev-parse --short HEAD)
          echo "image_tag=${SHA}" >> "$GITHUB_OUTPUT"
          { echo "tags<<EOF";
            echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${SHA}";
            echo "${{ env.GHCR_IMAGE }}:${SHA}";
            echo "EOF"; } >> "$GITHUB_OUTPUT"
          { echo "tags_frontend<<EOF";
            echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME_FRONTEND }}:${SHA}";
            echo "${{ env.GHCR_IMAGE_FRONTEND }}:${SHA}";
            echo "EOF"; } >> "$GITHUB_OUTPUT"

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4.1.3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret:    ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Trust minicloud CA
        run: |
          sudo mkdir -p /etc/docker/certs.d/${{ env.REGISTRY }}
          echo "${{ secrets.MINICLOUD_CA_CERT }}" | sudo tee /etc/docker/certs.d/${{ env.REGISTRY }}/ca.crt
          echo "${{ secrets.MINICLOUD_CA_CERT }}" | sudo tee /usr/local/share/ca-certificates/minicloud-ca.crt
          sudo update-ca-certificates

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.HARBOR_USER }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4
        with:
          buildkitd-config-inline: |
            [registry."harbor.10.0.0.200.nip.io"]
              insecure = true

      # Root-cause fix (c2a607a incident): SCAN BEFORE PUSH. Previously the image was pushed first and
      # scanned after, so a failed run (bad scan / later step) still left a promotable image in the
      # registry — Kargo's Warehouse (which only matches the tag regex) could then promote it. Now the
      # image is built + loaded LOCALLY, scanned, and only pushed if the scan passes → a failed run
      # NEVER leaves a promotable image. (Single-platform linux/amd64 makes `load: true` viable.)
      - name: Build (load locally — NOT pushed yet)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          load: true
          platforms: linux/amd64
          tags: local-scan/ktayl-claims:${{ steps.meta.outputs.image_tag }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      - name: Scan image (Trivy — CRITICAL only) — BEFORE any push
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref:      local-scan/ktayl-claims:${{ steps.meta.outputs.image_tag }}
          format:         table
          exit-code:      '1'
          severity:       CRITICAL
          ignore-unfixed: true

      - name: Push (only reached if the scan passed)
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha   # cache hit from the build above → just pushes, same digest

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3
      - name: Install syft
        uses: anchore/sbom-action/download-syft@v0

      - name: Generate SBOM (CycloneDX)
        run: |
          syft ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }} \
            -o cyclonedx-json=sbom.json

      - name: Sign + attach SBOM (Harbor)
        run: |
          cosign sign --yes ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          cosign attach sbom --sbom sbom.json --type cyclonedx \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}

      - name: Sign + attach SBOM (ghcr — prod)
        run: |
          cosign sign --yes ${{ env.GHCR_IMAGE }}@${{ steps.build.outputs.digest }}
          cosign attach sbom --sbom sbom.json --type cyclonedx \
            ${{ env.GHCR_IMAGE }}@${{ steps.build.outputs.digest }}

      # ── Frontend image (Angular workbench, ADR-009) — same scan-before-push discipline ──
      - name: Build frontend (load locally — NOT pushed yet)
        uses: docker/build-push-action@v7
        with:
          context: frontend
          file: frontend/Dockerfile
          load: true
          platforms: linux/amd64
          tags: local-scan/ktayl-claims-frontend:${{ steps.meta.outputs.image_tag }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      - name: Scan frontend (Trivy — CRITICAL only) — BEFORE any push
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref:      local-scan/ktayl-claims-frontend:${{ steps.meta.outputs.image_tag }}
          format:         table
          exit-code:      '1'
          severity:       CRITICAL
          ignore-unfixed: true

      - name: Push frontend (only if the scan passed)
        id: build_frontend
        uses: docker/build-push-action@v7
        with:
          context: frontend
          file: frontend/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags_frontend }}
          cache-from: type=gha

      - name: Generate frontend SBOM (CycloneDX)
        run: |
          syft ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_FRONTEND }}@${{ steps.build_frontend.outputs.digest }} \
            -o cyclonedx-json=sbom-frontend.json

      - name: Sign + attach frontend SBOM (Harbor)
        run: |
          cosign sign --yes ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_FRONTEND }}@${{ steps.build_frontend.outputs.digest }}
          cosign attach sbom --sbom sbom-frontend.json --type cyclonedx \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_FRONTEND }}@${{ steps.build_frontend.outputs.digest }}

      - name: Sign + attach frontend SBOM (ghcr — prod)
        run: |
          cosign sign --yes ${{ env.GHCR_IMAGE_FRONTEND }}@${{ steps.build_frontend.outputs.digest }}
          cosign attach sbom --sbom sbom-frontend.json --type cyclonedx \
            ${{ env.GHCR_IMAGE_FRONTEND }}@${{ steps.build_frontend.outputs.digest }}
