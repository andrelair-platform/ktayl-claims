spring:
  application:
    name: ktayl-claims-acl

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true   # /actuator/health/liveness + /readiness for k8s probes
  info:
    env:
      enabled: true

info:
  app:
    name: ktayl-claims-acl
    role: ACL / strangler over GlobalCore
